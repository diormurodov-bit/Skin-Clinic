<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Register — Skin—Clinic</title>
  <meta name="description" content="Skin—Clinic: premium organic skincare, cleansers, toners, creams, serums and lotions crafted for healthy, radiant skin.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Register — Skin—Clinic">
  <meta property="og:description" content="Skin—Clinic: premium organic skincare, cleansers, toners, creams, serums and lotions crafted for healthy, radiant skin.">
  <meta property="og:image" content="assets/icons/footer-logo.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Skin Clinic">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://api.wepro.uz" crossorigin>
  <link rel="dns-prefetch" href="https://api.wepro.uz">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-auth">
  <div id="header"></div>
  <main class="auth">
    <h1 class="form-title t-h2">Register</h1>
    <p class="form-error" id="form-error"></p>
    <form id="register-form" novalidate>
      <label class="field">
        <span class="field__label">Name</span>
        <input class="field__input" type="text" name="name" placeholder="Alex" autocomplete="given-name" maxlength="50" required>
      </label>
      <label class="field">
        <span class="field__label">Surname</span>
        <input class="field__input" type="text" name="surname" placeholder="Adams" autocomplete="family-name" maxlength="50" required>
      </label>
      <label class="field">
        <span class="field__label">Email</span>
        <input class="field__input" type="email" name="email" placeholder="Email" autocomplete="email" required>
      </label>
      <label class="field">
        <span class="field__label">Phone</span>
        <input class="field__input" type="tel" name="phone" placeholder="+998" autocomplete="tel" required>
      </label>
      <label class="field">
        <span class="field__label">Password</span>
        <input class="field__input" type="password" name="password" placeholder="Your password" autocomplete="new-password" minlength="4" maxlength="64" required>
      </label>
      <label class="field">
        <span class="field__label">Repeat your password</span>
        <input class="field__input" type="password" name="password2" placeholder="Your password" autocomplete="new-password" required>
      </label>
      <button class="btn-form" type="submit">Register</button>
    </form>
    <p class="form-alt"><a href="login.html" id="to-login">Already have an account? Log in</a></p>
  </main>
  <div id="footer"></div>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
