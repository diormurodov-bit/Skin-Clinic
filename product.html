<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Product — Skin—Clinic</title>
  <meta name="description" content="Skin—Clinic: premium organic skincare, cleansers, toners, creams, serums and lotions crafted for healthy, radiant skin.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Product — Skin—Clinic">
  <meta property="og:description" content="Skin—Clinic: premium organic skincare, cleansers, toners, creams, serums and lotions crafted for healthy, radiant skin.">
  <meta property="og:image" content="assets/icons/footer-logo.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Skin Clinic">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://api.wepro.uz" crossorigin>
  <link rel="dns-prefetch" href="https://api.wepro.uz">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>
  <main class="container pdp">
    <p class="pdp__msg" id="pdp-msg" hidden></p>
    <div class="pdp__top">
      <div class="pdp__img" id="pdp-img"></div>
      <div class="pdp__info">
        <h1 class="pdp__title" id="pdp-title"></h1>
        <p class="pdp__price" id="pdp-price"></p>
        <p class="pdp__desc">Crafted with botanical extracts to restore hydration, nourish the skin barrier, and impart a long-lasting, healthy glow.</p>
        <div class="pdp__actions">
          <div class="qty">
            <button type="button" id="qty-minus" aria-label="Decrease quantity"><img src="assets/icons/minus.svg" alt="−"></button>
            <span class="qty__value" id="qty-value">1</span>
            <button type="button" id="qty-plus" aria-label="Increase quantity"><img src="assets/icons/plus.svg" alt="+"></button>
          </div>
          <button type="button" class="btn-pill btn-pill--black" id="add-to-cart">Add to cart</button>
        </div>
      </div>
    </div>
    <section class="reviews">
      <div class="reviews__head">
        <div class="reviews__heading">
          <h2 class="reviews__title">All Reviews</h2>
          <span class="reviews__count" id="reviews-count"></span>
        </div>
        <button type="button" class="reviews__write" id="write-review">Write a Review</button>
      </div>
      <div class="reviews__grid" id="reviews"></div>
    </section>
  </main>
  <div class="modal" id="comment-modal" hidden role="dialog" aria-modal="true" aria-labelledby="comment-title">
    <form class="modal__card modal__card--comment" id="comment-form">
      <div>
        <h2 class="form-title t-h2" id="comment-title">Leave a comment</h2>
        <p class="form-error" id="comment-error" style="margin: 12px 0 0;"></p>
        <label class="field">
          <span class="field__label">Text</span>
          <textarea class="field__input" name="text" placeholder="Your comment" minlength="2" maxlength="300" required></textarea>
        </label>
        <div class="comment-meta">
          <span id="comment-hint">Enter at least 2 characters</span>
          <span id="comment-counter">0/300</span>
        </div>
        <button class="btn-form" type="submit" id="comment-submit" disabled>Send</button>
      </div>
    </form>
  </div>
  <div id="footer"></div>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
